<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@400;500;700&display=swap');

:root{
  --bg-0:#120C28;
  --bg-1:#1E1548;
  --card:#241A52;
  --line:rgba(255,255,255,0.08);
  --ink:#F4F1FF;
  --muted:#9C93C4;
  --yellow:#FFD23F;
  --pink:#FF4D8D;
  --teal:#2DD4BF;
  --font-display:'Cairo', sans-serif;
  --font-body:'Tajawal', sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,210,63,0.10), transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(255,77,141,0.12), transparent 45%),
    linear-gradient(160deg, var(--bg-0), var(--bg-1));
  color:var(--ink);
  font-family:var(--font-body);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:24px;
  padding-top:max(24px, env(safe-area-inset-top));
  padding-bottom:max(24px, env(safe-area-inset-bottom));
  padding-left:max(24px, env(safe-area-inset-left));
  padding-right:max(24px, env(safe-area-inset-right));
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
#app{width:100%; max-width:560px; margin:auto 0;}
h1,h2,h3{font-family:var(--font-display); margin:0; word-break:break-word;}
.eyebrow{font-family:var(--font-display); font-weight:800; font-size:12px; letter-spacing:.12em; color:var(--yellow); text-transform:uppercase;}
.card{background:linear-gradient(180deg, var(--card), rgba(36,26,82,0.6)); border:1px solid var(--line); border-radius:22px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,0.35);}
.stack{display:flex; flex-direction:column; gap:14px;}
.row{display:flex; gap:12px; flex-wrap:wrap;}
button{font-family:var(--font-display); font-weight:800; font-size:16px; border:none; border-radius:14px; padding:16px 20px; cursor:pointer; transition:transform .15s ease, filter .15s ease; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
button:active{transform:scale(0.97);}
.btn-primary{background:var(--yellow); color:#221800;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-secondary{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
.btn-secondary:hover{border-color:var(--muted);}
.btn-block{width:100%;}
.btn-disabled{opacity:.4; cursor:not-allowed;}
input,select{font-family:var(--font-body); font-size:16px; padding:14px 16px; border-radius:12px; border:1.5px solid var(--line); background:rgba(255,255,255,0.04); color:var(--ink); outline:none; width:100%; -webkit-appearance:none; appearance:none;}
input:focus,select:focus{border-color:var(--yellow);}
input::placeholder{color:var(--muted);}
.ticket{position:relative; background:var(--bg-0); border:2px dashed rgba(255,210,63,0.45); border-radius:16px; padding:22px; text-align:center;}
.ticket .code{font-family:var(--font-display); font-weight:900; font-size:clamp(30px, 9vw, 44px); letter-spacing:.18em; color:var(--yellow); word-break:break-all;}
.ticket .label{font-size:12px; color:var(--muted); margin-top:4px;}
.muted{color:var(--muted); font-size:14px; line-height:1.7;}
.pill{display:inline-block; padding:5px 12px; border-radius:999px; background:rgba(255,255,255,0.06); font-size:13px; color:var(--muted);}
.player-chip{display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.04); border-radius:12px; padding:10px 14px; font-weight:500;}
.avatar{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:14px; color:#221800;}
.timerbar-track{height:8px; border-radius:999px; background:rgba(255,255,255,0.08); overflow:hidden;}
.timerbar-fill{height:100%; background:linear-gradient(90deg, var(--teal), var(--yellow));}
.opt{text-align:right; border:1.5px solid var(--line); background:rgba(255,255,255,0.03); color:var(--ink); padding:16px 18px; border-radius:14px; font-family:var(--font-body); font-weight:500; font-size:16px; width:100%;}
.opt:hover{border-color:var(--yellow);}
.opt.correct{background:rgba(45,212,191,0.18); border-color:var(--teal); color:var(--teal);}
.opt.wrong{background:rgba(255,77,141,0.18); border-color:var(--pink); color:var(--pink);}
.score-row{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-radius:12px; background:rgba(255,255,255,0.04); font-weight:500;}
.score-row .rank{font-family:var(--font-display); font-weight:900; color:var(--yellow); width:28px;}
.big-score{font-family:var(--font-display); font-weight:900; font-size:38px; color:var(--yellow);}
.footnote{margin-top:18px; font-size:12.5px; color:var(--muted); line-height:1.8; border-top:1px solid var(--line); padding-top:14px;}
.badge-live{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--teal);}
.dot{width:7px; height:7px; border-radius:50%; background:var(--teal); animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.warn{background:rgba(255,77,141,0.12); border:1px solid var(--pink); color:var(--pink); padding:16px; border-radius:14px; font-size:14px; line-height:1.8;}

@media (max-width:380px){
  body{padding:16px; padding-top:max(16px, env(safe-area-inset-top)); padding-bottom:max(16px, env(safe-area-inset-bottom));}
  .card{padding:18px; border-radius:18px;}
  h1{font-size:22px !important;}
  h2{font-size:18px !important;}
  h3{font-size:15px !important;}
  button{padding:14px 16px; font-size:15px;}
  .opt{padding:14px 16px; font-size:15px;}
  .big-score{font-size:32px;}
}
@media (max-height:640px){
  body{align-items:flex-start;}
}
</style>
</head>

const QUESTION_DURATION = 12000;
const REVEAL_DURATION = 2500;

/* ================== حالة التطبيق ================== */
const SAVE_KEY = 'quizSession_v1';
function loadSavedSession(){
  try{ const raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveSession(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      role: state.role, roomCode: state.roomCode, myId: state.myId, playerName: state.playerName
    }));
  }catch(e){}
}
function clearSession(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function leaveRoom(){ clearSession(); location.reload(); }

const saved = loadSavedSession();
const state = {
  role: null, roomCode: null, myId: (saved && saved.myId) || Math.random().toString(36).slice(2,8),
  playerName:'', players:{}, answers:{}, currentIndex:-1, questionStart:null,
  duration: QUESTION_DURATION, correctIndex:null, myAnswerThisRound:null,
  questionIds: [], numQuestionsChoice: 20, durationChoice: QUESTION_DURATION,
  screen:'instructions', lastStatus:null, lastIndex:null,
};
const app = document.getElementById('app');
let timerRAF = null;

/* ================== أدوات مساعدة ================== */
function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c='';
  for(let i=0;i<4;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function roomRef(code){ return db.ref('rooms/' + code); }
function initials(name){ return (name||'?').trim().slice(0,1).toUpperCase(); }
function avatarColor(id){
  const colors=['#FFD23F','#FF4D8D','#2DD4BF','#8B7CFF','#FF9F5B'];
  let h=0; for(const ch of id) h+=ch.charCodeAt(0);
  return colors[h % colors.length];
}
function sortedPlayers(){ return Object.entries(state.players).sort((a,b)=>(b[1].score||0)-(a[1].score||0)); }
function shuffledIndices(n, count){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr.slice(0, count);
}
function totalQuestions(){ return (state.questionIds && state.questionIds.length) || QUESTIONS.length; }
function getQuestion(index){
  if(state.questionIds && state.questionIds.length) return QUESTIONS[state.questionIds[index]];
  return QUESTIONS[index];
}

/* ================== الاتصال بالغرفة (Firebase) ================== */
function attachRoomListener(){
  roomRef(state.roomCode).on('value', snap => handleRoomSnapshot(snap.val()));
}
function handleRoomSnapshot(room){
  if(!room) return;
  state.players = room.players || {};
  state.answers = room.answers || {};
  const statusChanged = room.status !== state.lastStatus || room.currentIndex !== state.lastIndex;
  if(statusChanged){
    state.lastStatus = room.status;
    state.lastIndex = room.currentIndex;
    state.currentIndex = room.currentIndex;
    state.questionStart = room.questionStart;
    state.duration = room.duration || QUESTION_DURATION;
    state.correctIndex = room.correctIndex;
    if(room.questionIds) state.questionIds = room.questionIds;
    if(room.currentIndex !== undefined) state.myAnswerThisRound = null;
    onStatusChange(room.status);
  } else {
    render();
  }
}
function onStatusChange(status){
  if(state.role === 'host'){
    if(status==='lobby') state.screen='host-lobby';
    if(status==='question'){ state.screen='host-question'; startHostTimer(state.duration, revealAnswer); }
    if(status==='reveal') state.screen='host-reveal';
    if(status==='end') state.screen='end';
  } else {
    if(status==='lobby') state.screen='player-lobby';
    if(status==='question'){ state.screen='player-question'; startPlayerTimer(state.duration); }
    if(status==='reveal') state.screen='player-reveal';
    if(status==='end') state.screen='end';
  }
  render();
}

/* ================== منطق المضيف (Host) ================== */
function createRoom(name){
  state.role='host';
  state.playerName = name;
  state.roomCode=genCode();
  const initialPlayers = {};
  initialPlayers[state.myId] = { name, score:0 };
  roomRef(state.roomCode).set({ status:'lobby', currentIndex:-1, players:initialPlayers, createdAt: Date.now() });
  attachRoomListener();
  saveSession();
}
function startGame(){
  const total = QUESTIONS.length;
  let count = parseInt(document.getElementById('numQInput')?.value, 10);
  if(!count || count < 1) count = state.numQuestionsChoice || 20;
  count = Math.max(1, Math.min(total, count));
  let dur = parseInt(document.getElementById('durSelect')?.value, 10);
  if(!dur) dur = state.durationChoice || QUESTION_DURATION;
  const questionIds = shuffledIndices(total, count);
  roomRef(state.roomCode).update({
    status:'question', currentIndex:0, questionStart:Date.now(),
    duration:dur, correctIndex:null, questionIds
  });
}
let nextTimeout = null;
function revealAnswer(){
  const q = getQuestion(state.currentIndex);
  const answers = state.answers[state.currentIndex] || {};
  const updatedPlayers = {...state.players};
  for(const id in answers){
    if(!updatedPlayers[id]) continue;
    const a = answers[id];
    if(a.choice === q.correct){
      const elapsed = a.time - state.questionStart;
      const speedFactor = Math.max(0, 1 - elapsed/state.duration);
      const points = Math.round(500 + 500*speedFactor);
      updatedPlayers[id] = {...updatedPlayers[id], score:(updatedPlayers[id].score||0)+points};
    }
  }
  roomRef(state.roomCode).update({ status:'reveal', correctIndex:q.correct, players:updatedPlayers });
  clearTimeout(nextTimeout);
  nextTimeout = setTimeout(nextQuestion, REVEAL_DURATION);
}
function goToNextNow(){
  clearTimeout(nextTimeout);
  nextQuestion();
}
function nextQuestion(){
  const nextIndex = state.currentIndex + 1;
  if(nextIndex >= totalQuestions()){
    roomRef(state.roomCode).update({ status:'end' });
  } else {
    roomRef(state.roomCode).update({ status:'question', currentIndex:nextIndex, questionStart:Date.now(), duration:state.duration, correctIndex:null });
  }
}

/* ================== منطق اللاعب (Player) ================== */
function joinRoom(name, code){
  state.role='player';
  state.playerName=name;
  state.roomCode=code.toUpperCase();
  roomRef(state.roomCode).child('players').child(state.myId).set({ name, score:0 })
    .then(() => { attachRoomListener(); saveSession(); })
    .catch(err => {
      state.screen='join-form';
      state.joinError = 'تعذّر الانضمام: ' + err.message + ' — تأكد إن Realtime Database مفعّل ووضع test mode لسا فعّال بمشروع Firebase.';
      render();
    });
}
function submitAnswer(choiceIndex){
  if(state.myAnswerThisRound !== null) return;
  state.myAnswerThisRound = choiceIndex;
  render();
  roomRef(state.roomCode).child('answers').child(state.currentIndex).child(state.myId).set({ choice:choiceIndex, time:Date.now() });
}

/* ================== المؤقتات ================== */
function startHostTimer(duration, onDone){
  cancelAnimationFrame(timerRAF);
  const start = state.questionStart;
  const bar = () => {
    const el = document.getElementById('timerFill');
    if(el){ const pct = Math.max(0, 1-(Date.now()-start)/duration); el.style.width = (pct*100)+'%'; }
    if(Date.now()-start < duration){ timerRAF = requestAnimationFrame(bar); } else { onDone(); }
  };
  timerRAF = requestAnimationFrame(bar);
}
function startPlayerTimer(duration){
  cancelAnimationFrame(timerRAF);
  const start = state.questionStart;
  const bar = () => {
    const el = document.getElementById('timerFill');
    if(el){ const pct = Math.max(0, 1-(Date.now()-start)/duration); el.style.width = (pct*100)+'%'; }
    if(Date.now()-start < duration){ timerRAF = requestAnimationFrame(bar); }
  };
  timerRAF = requestAnimationFrame(bar);
}

          <input id="nameInput" placeholder="اسمك" maxlength="16">
          <input id="codeInput" placeholder="كود الغرفة" maxlength="4" style="text-transform:uppercase;">
          ${state.joinError ? `<div class="warn">${state.joinError}</div>` : ''}
          <button class="btn-primary btn-block" onclick="handleJoinClick()">انضمام</button>
          <button class="btn-secondary btn-block" onclick="state.screen='home'; state.joinError=null; render();">رجوع</button>
        </div>
      </div>`;
  }

  else if(state.screen === 'host-lobby'){
    const players = sortedPlayers();
    html = `
      <div class="stack">
        <div class="row" style="justify-content:space-between; align-items:center;">
          <div class="eyebrow">وضع المضيف</div>
          <span class="muted" style="font-size:12px; text-decoration:underline; cursor:pointer;" onclick="leaveRoom()">خروج / غرفة جديدة</span>
        </div>
        <div class="ticket">
          <div class="code">${state.roomCode}</div>
          <div class="label">كود الغرفة — شاركه مع اللاعبين</div>
        </div>
        <div class="card stack">
          <div class="row" style="justify-content:space-between; align-items:center;">
            <h3>اللاعبون</h3><span class="pill">${players.length} منضمّ</span>
          </div>
          ${players.length===0 ? '<p class="muted">بانتظار انضمام اللاعبين…</p>' :
            `<div class="stack" style="max-height:340px; overflow-y:auto;">` +
            players.map(([id,p]) => `
              <div class="player-chip">
                <span class="row" style="align-items:center; gap:10px;">
                  <span class="avatar" style="background:${avatarColor(id)}">${initials(p.name)}</span>${p.name}${id===state.myId?' (أنت)':''}
                </span>
                <span class="badge-live"><span class="dot"></span>متصل</span>
              </div>`).join('') + `</div>`}
          <div class="stack" style="border-top:1px solid var(--line); padding-top:14px;">
            <label class="muted" style="font-size:13px;">عدد الأسئلة (المتوفر: ${QUESTIONS.length})</label>
            <input id="numQInput" type="number" min="1" max="${QUESTIONS.length}" value="${state.numQuestionsChoice}" oninput="state.numQuestionsChoice=this.value">
            <label class="muted" style="font-size:13px;">الوقت لكل سؤال</label>
            <select id="durSelect" onchange="state.durationChoice=parseInt(this.value,10)" style="font-family:var(--font-body); font-size:16px; padding:14px 16px; border-radius:12px; border:1.5px solid var(--line); background:rgba(255,255,255,0.04); color:var(--ink); width:100%;">
              <option value="8000" ${state.durationChoice==8000?'selected':''}>8 ثواني</option>
              <option value="12000" ${state.durationChoice==12000?'selected':''}>12 ثانية</option>
              <option value="15000" ${state.durationChoice==15000?'selected':''}>15 ثانية</option>
              <option value="20000" ${state.durationChoice==20000?'selected':''}>20 ثانية</option>
              <option value="30000" ${state.durationChoice==30000?'selected':''}>30 ثانية</option>
            </select>
          </div>
          <button class="btn-primary btn-block ${players.length===0?'btn-disabled':''}" ${players.length===0?'disabled':''} onclick="startGame()">ابدأ اللعبة</button>
        </div>
      </div>`;
  }

  else if(state.screen === 'player-lobby'){
    const players = sortedPlayers();
    html = `
      <div class="stack">
        <div class="row" style="justify-content:space-between; align-items:center;">
          <div class="eyebrow">في الغرفة ${state.roomCode}</div>
          <span class="muted" style="font-size:12px; text-decoration:underline; cursor:pointer;" onclick="leaveRoom()">خروج / غرفة جديدة</span>
        </div>
        <h1 style="font-size:26px;">أهلاً ${state.playerName} 👋</h1>
        <div class="card stack">
          <p class="muted">بانتظار أن يبدأ المضيف اللعبة…</p>
          ${players.map(([id,p]) => `
            <div class="player-chip">
              <span class="row" style="align-items:center; gap:10px;">
                <span class="avatar" style="background:${avatarColor(id)}">${initials(p.name)}</span>${p.name}
              </span>
            </div>`).join('')}
        </div>
      </div>`;
  }

  else if(state.screen === 'host-question'){
    const q = getQuestion(state.currentIndex);
    const total = Object.keys(state.players).length;
    const answered = Object.keys(state.answers[state.currentIndex] || {}).length;
    const myAnswered = state.myAnswerThisRound !== null;
    html = `
      <div class="stack">
        <div class="row" style="justify-content:space-between;">
          <span class="pill">سؤال ${state.currentIndex+1} / ${totalQuestions()} · ${q.cat||''}</span>
          <span class="pill">${answered} / ${total} أجابوا</span>
        </div>
        <div class="timerbar-track"><div class="timerbar-fill" id="timerFill" style="width:100%"></div></div>
        <div class="card stack">
          <h2 style="font-size:22px; line-height:1.5;">${q.q}</h2>
          <div class="stack">
            ${q.options.map((opt,i) => `
              <button class="opt ${myAnswered && i===state.myAnswerThisRound ? 'correct' : ''}" ${myAnswered?'disabled':''}
                onclick="submitAnswer(${i})">${opt}</button>`).join('')}
          </div>
        </div>
        ${myAnswered ? '<p class="muted" style="text-align:center;">تم إرسال إجابتك، بانتظار البقية…</p>' : '<p class="muted" style="text-align:center;">جاوب أنت كمان قبل ما ينتهي الوقت</p>'}
      </div>`;
  }

  else if(state.screen === 'host-reveal'){
    const q = getQuestion(state.currentIndex);
    const players = sortedPlayers();
    const mine = state.players[state.myId];
    html = `
      <div class="stack">
        <div class="card stack" style="text-align:center;">
          <div class="muted">نقاطك حتى الآن</div>
          <div class="big-score">${mine ? mine.score : 0}</div>
        </div>
        <h2>الإجابة الصحيحة</h2>
        <div class="card stack">
          <div class="stack">${q.options.map((opt,i) => `<div class="opt ${i===q.correct?'correct':''}">${opt}</div>`).join('')}</div>
        </div>
        <div class="card stack">
          <h3>الترتيب الحالي</h3>
          <div class="stack" style="max-height:360px; overflow-y:auto;">
          ${players.map(([id,p],i) => `
            <div class="score-row">
              <span class="row" style="align-items:center; gap:10px;"><span class="rank">${i+1}</span>${p.name}${id===state.myId?' (أنت)':''}</span>
              <span>${p.score||0}</span>
            </div>`).join('')}
          </div>
        </div>
        <button class="btn-primary btn-block" onclick="goToNextNow()">التالي الآن ⏭</button>
      </div>`;
  }

  else if(state.screen === 'player-question'){
    const q = getQuestion(state.currentIndex);
    const answered = state.myAnswerThisRound !== null;
    html = `
      <div class="stack">
        <span class="pill">سؤال ${state.currentIndex+1} / ${totalQuestions()} · ${q.cat||''}</span>
        <div class="timerbar-track"><div class="timerbar-fill" id="timerFill" style="width:100%"></div></div>
        <div class="card stack">
          <h2 style="font-size:20px; line-height:1.5;">${q.q}</h2>
          <div class="stack">
            ${q.options.map((opt,i) => `
              <button class="opt ${answered && i===state.myAnswerThisRound ? 'correct' : ''}" ${answered?'disabled':''}
                onclick="submitAnswer(${i})">${opt}</button>`).join('')}
          </div>
        </div>
        ${answered ? '<p class="muted" style="text-align:center;">تم إرسال إجابتك، بانتظار البقية…</p>' : ''}
      </div>`;
  }

  else if(state.screen === 'player-reveal'){
    const players = sortedPlayers();
    const mine = state.players[state.myId];
    html = `
      <div class="stack">
        <div class="card stack" style="text-align:center;">
          <div class="muted">نقاطك حتى الآن</div>
          <div class="big-score">${mine ? mine.score : 0}</div>
        </div>
        <div class="card stack">
          <h3>الترتيب</h3>
          <div class="stack" style="max-height:360px; overflow-y:auto;">
          ${players.map(([id,p],i) => `
            <div class="score-row">
              <span class="row" style="align-items:center; gap:10px;"><span class="rank">${i+1}</span>${p.name}</span>
              <span>${p.score||0}</span>
            </div>`).join('')}
          </div>
        </div>
        <p class="muted" style="text-align:center;">السؤال التالي قريبًا…</p>
      </div>`;
  }

  else if(state.screen === 'end'){
    const players = sortedPlayers();
    html = `
      <div class="stack">
        <div class="eyebrow">انتهت المسابقة</div>
        <h1 style="font-size:28px;">🏆 النتائج النهائية</h1>
        <div class="card stack">
          <div class="stack" style="max-height:420px; overflow-y:auto;">
          ${players.map(([id,p],i) => `
            <div class="score-row">
              <span class="row" style="align-items:center; gap:10px;">
                <span class="rank">${i+1}</span>
                <span class="avatar" style="background:${avatarColor(id)}">${initials(p.name)}</span>${p.name}
              </span>
              <span>${p.score||0}</span>
            </div>`).join('')}
          </div>
        </div>
        <button class="btn-secondary btn-block" onclick="clearSession(); location.reload()">جولة جديدة</button>
      </div>`;
  }

  app.innerHTML = html;
}

function showHostForm(){ state.hostError=null; state.screen='host-name-form'; render(); }
function handleHostClick(){
  const name = document.getElementById('hostNameInput').value.trim();
  if(!name){ state.hostError='لازم تكتب اسمك أولاً.'; render(); return; }
  createRoom(name);
}
function showJoinForm(){ state.joinError=null; state.screen='join-form'; render(); }
function handleJoinClick(){
  const name = document.getElementById('nameInput').value.trim();
  const code = document.getElementById('codeInput').value.trim();
  if(!name){ state.joinError='لازم تكتب اسمك أولاً.'; render(); return; }
  if(code.length !== 4){ state.joinError='كود الغرفة لازم يكون 4 أحرف بالضبط.'; render(); return; }
  state.joinError = null;
  joinRoom(name, code);
}
/* ================== استعادة الجلسة بعد التحديث/الإغلاق ================== */
function restoreSession(){
  if(!configReady) return false;
  if(!saved || !saved.roomCode || !saved.role) return false;
  // تحقق أول إن الغرفة المحفوظة لسا موجودة ومو منتهية قبل ما نرجع لها تلقائيًا
  roomRef(saved.roomCode).once('value').then(snap => {
    const room = snap.val();
    if(!room || room.status === 'end'){
      clearSession();
      render();
      return;
    }
    state.role = saved.role;
    state.roomCode = saved.roomCode;
    state.playerName = saved.playerName || '';
    attachRoomListener();
  }).catch(() => { clearSession(); render(); });
  return true;
}

// إعادة مزامنة فورية كل ما رجع التطبيق يكون ظاهر (بعد قفل الشاشة أو تبديل التطبيقات)
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && state.roomCode && db){
    roomRef(state.roomCode).once('value').then(snap => handleRoomSnapshot(snap.val()));
  }
});
window.addEventListener('online', () => {
  if(state.roomCode && db){
    roomRef(state.roomCode).once('value').then(snap => handleRoomSnapshot(snap.val()));
  }
});

if(!restoreSession()) render();
</script>
</body>
</html>
