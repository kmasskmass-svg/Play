<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@400;500;700&display=swap');

:root{
  --bg-0:#120C28;
  --bg-1:#1E1548;
  --card:#241A52;
  --line:rgba(255,255,255,0.08);
  --ink:#F4F1FF;
  --muted:#9C93C4;
  --yellow:#FFD23F;
  --pink:#FF4D8D;
  --teal:#2DD4BF;
  --font-display:'Cairo', sans-serif;
  --font-body:'Tajawal', sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,210,63,0.10), transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(255,77,141,0.12), transparent 45%),
    linear-gradient(160deg, var(--bg-0), var(--bg-1));
  color:var(--ink);
  font-family:var(--font-body);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:24px;
  padding-top:max(24px, env(safe-area-inset-top));
  padding-bottom:max(24px, env(safe-area-inset-bottom));
  padding-left:max(24px, env(safe-area-inset-left));
  padding-right:max(24px, env(safe-area-inset-right));
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
#app{width:100%; max-width:560px; margin:auto 0;}
h1,h2,h3{font-family:var(--font-display); margin:0; word-break:break-word;}
.eyebrow{font-family:var(--font-display); font-weight:800; font-size:12px; letter-spacing:.12em; color:var(--yellow); text-transform:uppercase;}
.card{background:linear-gradient(180deg, var(--card), rgba(36,26,82,0.6)); border:1px solid var(--line); border-radius:22px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,0.35);}
.stack{display:flex; flex-direction:column; gap:14px;}
.row{display:flex; gap:12px; flex-wrap:wrap;}
button{font-family:var(--font-display); font-weight:800; font-size:16px; border:none; border-radius:14px; padding:16px 20px; cursor:pointer; transition:transform .15s ease, filter .15s ease; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
button:active{transform:scale(0.97);}
.btn-primary{background:var(--yellow); color:#221800;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-secondary{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
.btn-secondary:hover{border-color:var(--muted);}
.btn-block{width:100%;}
.btn-disabled{opacity:.4; cursor:not-allowed;}
input,select{font-family:var(--font-body); font-size:16px; padding:14px 16px; border-radius:12px; border:1.5px solid var(--line); background:rgba(255,255,255,0.04); color:var(--ink); outline:none; width:100%; -webkit-appearance:none; appearance:none;}
input:focus,select:focus{border-color:var(--yellow);}
input::placeholder{color:var(--muted);}
.ticket{position:relative; background:var(--bg-0); border:2px dashed rgba(255,210,63,0.45); border-radius:16px; padding:22px; text-align:center;}
.ticket .code{font-family:var(--font-display); font-weight:900; font-size:clamp(30px, 9vw, 44px); letter-spacing:.18em; color:var(--yellow); word-break:break-all;}
.ticket .label{font-size:12px; color:var(--muted); margin-top:4px;}
.muted{color:var(--muted); font-size:14px; line-height:1.7;}
.pill{display:inline-block; padding:5px 12px; border-radius:999px; background:rgba(255,255,255,0.06); font-size:13px; color:var(--muted);}
.player-chip{display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.04); border-radius:12px; padding:10px 14px; font-weight:500;}
.avatar{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:14px; color:#221800;}
.timerbar-track{height:8px; border-radius:999px; background:rgba(255,255,255,0.08); overflow:hidden;}
.timerbar-fill{height:100%; background:linear-gradient(90deg, var(--teal), var(--yellow));}
.spinner{width:42px; height:42px; border:4px solid rgba(255,255,255,0.15); border-top-color:var(--yellow); border-radius:50%; animation:spin 0.8s linear infinite;}
@keyframes spin{ to{ transform:rotate(360deg); } }
.opt{text-align:right; border:1.5px solid var(--line); background:rgba(255,255,255,0.03); color:var(--ink); padding:16px 18px; border-radius:14px; font-family:var(--font-body); font-weight:500; font-size:16px; width:100%;}
.opt:hover{border-color:var(--yellow);}
.opt.correct{background:rgba(45,212,191,0.18); border-color:var(--teal); color:var(--teal);}
.opt.wrong{background:rgba(255,77,141,0.18); border-color:var(--pink); color:var(--pink);}
.score-row{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-radius:12px; background:rgba(255,255,255,0.04); font-weight:500;}
.score-row .rank{font-family:var(--font-display); font-weight:900; color:var(--yellow); width:28px;}
.big-score{font-family:var(--font-display); font-weight:900; font-size:38px; color:var(--yellow);}
.footnote{margin-top:18px; font-size:12.5px; color:var(--muted); line-height:1.8; border-top:1px solid var(--line); padding-top:14px;}
.badge-live{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--teal);}
.dot{width:7px; height:7px; border-radius:50%; background:var(--teal); animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.warn{background:rgba(255,77,141,0.12); border:1px solid var(--pink); color:var(--pink); padding:16px; border-radius:14px; font-size:14px; line-height:1.8;}

@media (max-width:380px){
  body{padding:16px; padding-top:max(16px, env(safe-area-inset-top)); padding-bottom:max(16px, env(safe-area-inset-bottom));}
  .card{padding:18px; border-radius:18px;}
  h1{font-size:22px !important;}
  h2{font-size:18px !important;}
  h3{font-size:15px !important;}
  button{padding:14px 16px; font-size:15px;}
  .opt{padding:14px 16px; font-size:15px;}
  .big-score{font-size:32px;}
}
@media (max-height:640px){
  body{align-items:flex-start;}
}
</style>
</head>

   - من ⚙️ Project settings → Your apps → Web app (</>) → انسخ كائن الإعدادات وحطه هون بدل القيم تحت

   2) مهم جدًا — الأمان:
   ⚠️ خطوة إلزامية (مرة واحدة فقط) خارج هذا الملف، لأن قواعد الحماية تُخزَّن على
   خوادم Firebase وليس داخل الكود، فلا يمكن ضبطها من هنا مهما كتبنا:

   أ) في console.firebase.google.com → Build → Authentication → Sign-in method
      فعّل "Anonymous" (تسجيل دخول مجهول تلقائي، بدون كلمة مرور ولا بيانات المستخدم).

   ب) في Realtime Database → Rules، الصق هذا بدل القواعد الحالية ثم اضغط Publish:

   {
     "rules": {
       ".read": true,
       ".write": "auth != null"
     }
   }

   مقتصرة فقط على من دخل فعليًا عبر هذا الموقع (تسجيل دخول مجهول تلقائي يحصل

   صلاحيتها ولا تحتاج تجديد كل 30 يوم.

   الكود تحت يتكفل تلقائيًا بتسجيل كل متسابق دخولًا مجهولًا فور فتح الصفحة،
   وينتظر اكتمال ذلك قبل تفعيل القراءة/الكتابة، بحيث يبقى اللعب متزامنًا بين
   كل المتسابقين في نفس الوقت كما كان يعمل تمامًا.
   ========================================================= */

let db = null;
let dbReady = false; // يصير true فقط بعد تسجيل الدخول المجهول بنجاح
const configReady = firebaseConfig.apiKey !== "YOUR_API_KEY";
if(configReady){
  firebase.initializeApp(firebaseConfig);

  streak5:         { icon:'🔥', name:'سلسلة نار',    desc:'حققت 5 إجابات صحيحة متتالية أو أكثر' },
  speedster:       { icon:'⚡', name:'الأسرع',       desc:'كنت أول من يجاوب صح 3 مرات أو أكثر بنفس الجولة' },
  category_expert: { icon:'📚', name:'خبير الفئة',   desc:'أجبت صح على 5 أسئلة أو أكثر من نفس الفئة بجولة واحدة' },
  champion:        { icon:'👑', name:'البطل',        desc:'حللت بالمركز الأول بمسابقة جماعية' },
};
function computeRoundBadges(stats){
  const ids = [];
  if(stats.totalQuestions > 0 && stats.correctCount === stats.totalQuestions) ids.push('perfect');
  if((stats.maxStreak||0) >= 5) ids.push('streak5');
  if((stats.fastestCount||0) >= 3) ids.push('speedster');
  if(stats.catCorrect && Object.values(stats.catCorrect).some(c => c >= 5)) ids.push('category_expert');
  if(stats.isChampion) ids.push('champion');
  return ids;
}
function badgesHtml(ids){
  if(!ids || !ids.length) return '';
  return `<div class="row" style="flex-wrap:wrap; justify-content:center; gap:8px;">
    ${ids.map(id => BADGES[id] ? `<span class="pill" title="${BADGES[id].desc}">${BADGES[id].icon} ${BADGES[id].name}</span>` : '').join('')}
  </div>`;
}
const DIFF_POINTS = { 1:500, 2:1000, 3:1500 };

/* ================== حالة التطبيق ================== */
const SAVE_KEY = 'quizSession_v1';
function loadSavedSession(){
  try{ const raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveSession(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      role: state.role, roomCode: state.roomCode, myId: state.myId, playerName: state.playerName
    }));
  }catch(e){}
}
function clearSession(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function leaveRoom(){ clearSession(); location.reload(); }

const saved = loadSavedSession();
const state = {
  role: null, roomCode: null, myId: (saved && saved.myId) || Math.random().toString(36).slice(2,8),
  playerName:'', players:{}, answers:{}, currentIndex:-1, questionStart:null,
  duration: QUESTION_DURATION, correctIndex:null, myAnswerThisRound:null,
  questionIds: [], numQuestionsChoice: 20, durationChoice: QUESTION_DURATION,
  selectedCats: [...CATEGORIES],
  selectedDiffs: [1,2,3], fastestId:null,
  screen:'splash', lastStatus:null, lastIndex:null,
  pvpMode:false, pvpAsker:null, pvpTarget:null, paused:false,
  adaptiveMode:false, adaptiveDiff:2, gameCats:null, gameDiffs:null, totalCount:0,
  soloScore:0, soloStreak:0, soloIndex:-1, soloQuestionIds:[], soloTotalCount:0,
  soloAdaptiveMode:false, soloAdaptiveDiff:2, soloCats:null, soloDiffs:null, soloLastPoints:0, soloError:null,
  soloMaxStreak:0, soloCorrectCount:0, soloCatCorrect:{}, soloEarnedBadges:[],
};
const app = document.getElementById('app');
let timerRAF = null;

/* ================== أدوات مساعدة ================== */
function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c='';
  for(let i=0;i<4;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function roomRef(code){ return db.ref('rooms/' + code); }
function answersRef(code){ return db.ref('answers/' + code); }
function leaderboardRef(){ return db.ref('leaderboard'); }
// ينتظر اكتمال تسجيل الدخول المجهول قبل تنفيذ أي كتابة (يحمي من بطء الشبكة عند أول فتح للصفحة)
function whenAuthReady(fn){
  if(dbReady){ fn(); return; }
  const check = setInterval(function(){
    if(dbReady){ clearInterval(check); fn(); }
  }, 100);
}
/* ================== لوحة الصدارة (Leaderboard) ==================
   تُخزَّن تحت المسار "leaderboard/{myId}" — myId معرّف ثابت لكل جهاز (محفوظ
   بالمتصفح)، وليس اسم اللاعب، حتى لو تكرر نفس الاسم عند أشخاص مختلفين.
   كل جهاز يكتب سجله الخاص فقط، فما في تعارض بين اللاعبين. */
function saveLeaderboardEntry(name, roundScore, roundBadgeIds){
  if(!configReady || !name) return;
  whenAuthReady(function(){
    const ref = leaderboardRef().child(state.myId);
    ref.once('value').then(function(snap){
      const prev = snap.val() || { totalScore:0, gamesPlayed:0, bestScore:0, badges:{} };
      const badges = {...(prev.badges||{})};
      (roundBadgeIds||[]).forEach(id => { badges[id] = true; });
      ref.set({
        name: name,
        totalScore: (prev.totalScore||0) + (roundScore||0),
        gamesPlayed: (prev.gamesPlayed||0) + 1,
        bestScore: Math.max(prev.bestScore||0, roundScore||0),
        badges: badges,
        updatedAt: Date.now()
      });
    });
  });
}
function openLeaderboard(){
  state.screen = 'leaderboard';
  state.leaderboardData = null;
  render();
  if(!configReady) return;
  whenAuthReady(function(){
    leaderboardRef().once('value').then(function(snap){
      const val = snap.val() || {};
      const rows = Object.values(val).sort((a,b) => (b.bestScore||0) - (a.bestScore||0)).slice(0, 30);
      state.leaderboardData = rows;
      render();
    }).catch(function(){
      state.leaderboardData = [];
      render();
    });
  });
}

let currentAnswersRef = null;
function watchCurrentAnswers(index){
  if(currentAnswersRef) currentAnswersRef.off();
  state.answers = {};
  currentAnswersRef = answersRef(state.roomCode).child(index);
  currentAnswersRef.on('value', snap => {
    state.answers = { [index]: snap.val() || {} };
    render();
  });
}
function initials(name){ return (name||'?').trim().slice(0,1).toUpperCase(); }
function avatarColor(id){
  const colors=['#FFD23F','#FF4D8D','#2DD4BF','#8B7CFF','#FF9F5B'];
  let h=0; for(const ch of id) h+=ch.charCodeAt(0);
  return colors[h % colors.length];
}
function sortedPlayers(){ return Object.entries(state.players).sort((a,b)=>(b[1].score||0)-(a[1].score||0)); }
function shuffledIndices(n, count){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr.slice(0, count);
}
function totalQuestions(){ return state.totalCount || (state.questionIds && state.questionIds.length) || QUESTIONS.length; }
function hostControlsHtml(){
  return `<div class="row" style="justify-content:flex-end; gap:8px;">
    <span onclick="pauseGame()" class="pill" style="cursor:pointer; user-select:none;">⏸ إيقاف مؤقت</span>
    <span onclick="endGameNow()" class="pill" style="cursor:pointer; user-select:none; color:var(--pink); border-color:var(--pink);">⏹ إنهاء اللعبة</span>
  </div>`;
}
function getQuestion(index){
  if(state.questionIds && state.questionIds.length) return QUESTIONS[state.questionIds[index]];
  return QUESTIONS[index];
}

/* ================== الاتصال بالغرفة (Firebase) ================== */
function attachRoomListener(){
  roomRef(state.roomCode).on('value', snap => handleRoomSnapshot(snap.val()));
  attachReactionsListener();
}
/* ================== الإيموجيز التفاعلية ==================
   كل لاعب يقدر يبعت إيموجي سريع يظهر عائمًا لكل اللاعبين بنفس الغرفة لحظيًا.
   تُخزَّن تحت مسار منفصل "reactions/{roomCode}" (بعيدًا عن بيانات الغرفة
   الأساسية)، وتُقرأ عبر child_added عشان ما نعيد تحميل كل الغرفة مع كل إيموجي. */
function reactionsRef(code){ return db.ref('reactions/' + code); }
let reactionsListenerActive = null;
function attachReactionsListener(){
  if(reactionsListenerActive === state.roomCode) return; // مرتبط بنفس الغرفة أصلًا
  reactionsListenerActive = state.roomCode;
  const attachTime = Date.now();
  reactionsRef(state.roomCode).on('child_added', snap => {
    const r = snap.val();
    if(!r || !r.emoji) return;
    if(r.ts && r.ts < attachTime - 4000) return; // تجاهل إيموجيز قديمة عند الرجوع للغرفة
    showFloatingReaction(r.emoji, r.name);
  });
}
let lastReactionAt = 0;
function sendReaction(emoji){
  const now = Date.now();
  if(now - lastReactionAt < 1200) return; // تبريد بسيط لمنع الإغراق
  lastReactionAt = now;
  whenAuthReady(function(){
    reactionsRef(state.roomCode).push({ emoji, name: state.playerName || '؟', id: state.myId, ts: Date.now() });
  });
}
function ensureReactionsLayer(){
  let layer = document.getElementById('reactionsLayer');
  if(!layer){
    layer = document.createElement('div');
    layer.id = 'reactionsLayer';
    layer.style.cssText = 'position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:70;';
    document.body.appendChild(layer);
  }
  return layer;
}
function showFloatingReaction(emoji, name){
  const layer = ensureReactionsLayer();
  const el = document.createElement('div');
  el.textContent = emoji;
  const label = document.createElement('div');
  label.textContent = name || '';
  label.style.cssText = 'font-size:11px; text-align:center; color:#fff; opacity:0.85; margin-top:-2px;';
  const wrap = document.createElement('div');
  const left = 8 + Math.random()*76;
  wrap.style.cssText = `position:absolute; left:${left}%; bottom:6%; text-align:center; transition: transform 2.4s ease-out, opacity 2.4s ease-out; opacity:1;`;
  el.style.cssText = 'font-size:30px; text-shadow:0 2px 8px rgba(0,0,0,0.45); line-height:1;';
  wrap.appendChild(el);
  wrap.appendChild(label);
  layer.appendChild(wrap);
  requestAnimationFrame(() => {
    wrap.style.transform = `translateY(-${220 + Math.random()*80}px)`;
    wrap.style.opacity = '0';
  });
  setTimeout(() => wrap.remove(), 2600);
}
function reactionBarHtml(){
  const emojis = ['👏','😂','🔥','😮','👎'];
  return `<div class="row" style="justify-content:center; gap:10px; flex-wrap:wrap;">
    ${emojis.map(e => `<span onclick="sendReaction('${e}')" class="pill" style="cursor:pointer; user-select:none; font-size:18px; padding:8px 12px;">${e}</span>`).join('')}
  </div>`;
}
function handleRoomSnapshot(room){
  if(!room) return;
  state.players = room.players || {};
  if(room.pvpMode !== undefined) state.pvpMode = room.pvpMode;
  if(room.adaptiveMode !== undefined) state.adaptiveMode = room.adaptiveMode;
  if(room.adaptiveDiff !== undefined) state.adaptiveDiff = room.adaptiveDiff;
  if(room.gameCats) state.gameCats = room.gameCats;
  if(room.gameDiffs) state.gameDiffs = room.gameDiffs;
  if(room.totalCount) state.totalCount = room.totalCount;
  state.pvpAsker = room.pvpAsker || null;
  state.pvpTarget = room.pvpTarget || null;
  state.fastestId = room.fastestId || null;
  const pausedChanged = !!room.paused !== !!state.paused;
  state.paused = !!room.paused;
  if(pausedChanged){
    cancelAnimationFrame(timerRAF);
    clearTimeout(nextTimeout);
    if(state.paused){
      state.screen = state.role==='host' ? 'host-paused' : 'player-paused';
      render();
      return;
    } else {
      state.currentIndex = room.currentIndex;
      state.correctIndex = room.correctIndex;
      if(room.questionIds) state.questionIds = room.questionIds;
      state.lastStatus = room.status;
      state.lastIndex = room.currentIndex;
      if(room.status==='question'){
        state.questionStart = room.questionStart;
        state.duration = room.duration || QUESTION_DURATION;
        state.screen = state.role==='host' ? 'host-question' : 'player-question';
        if(state.role==='host'){ watchCurrentAnswers(state.currentIndex); startHostTimer(state.duration, revealAnswer); } else startPlayerTimer(state.duration);
      } else if(room.status==='reveal'){
        state.screen = state.role==='host' ? 'host-reveal' : 'player-reveal';
        if(state.role==='host') nextTimeout = setTimeout(nextQuestion, REVEAL_DURATION);
      } else if(room.status==='picking'){
        state.screen = state.role==='host' ? 'host-picking' : 'player-picking-wait';
      } else if(room.status==='lobby'){
        state.screen = state.role==='host' ? 'host-lobby' : 'player-lobby';
      } else if(room.status==='end'){
        state.screen = 'end';
      }
      render();
      return;
    }
  }
  const statusChanged = room.status !== state.lastStatus || room.currentIndex !== state.lastIndex;
  if(statusChanged){
    state.lastStatus = room.status;
    state.lastIndex = room.currentIndex;
    state.currentIndex = room.currentIndex;
    state.questionStart = room.questionStart;
    state.duration = room.duration || QUESTION_DURATION;
    state.correctIndex = room.correctIndex;
    if(room.questionIds) state.questionIds = room.questionIds;
    if(room.currentIndex !== undefined) state.myAnswerThisRound = null;
    onStatusChange(room.status);
  } else {
    render();
  }
}
function onStatusChange(status){
  if(state.role === 'host'){
    if(status==='lobby') state.screen='host-lobby';
    if(status==='picking') state.screen='host-picking';
    if(status==='question'){ state.screen='host-question'; watchCurrentAnswers(state.currentIndex); startHostTimer(state.duration, revealAnswer); }
    if(status==='reveal') state.screen='host-reveal';
    if(status==='end') state.screen='end';
  } else {
    if(status==='lobby') state.screen='player-lobby';
    if(status==='picking') state.screen='player-picking-wait';
    if(status==='question'){ state.screen='player-question'; startPlayerTimer(state.duration); }
    if(status==='reveal'){
      state.screen='player-reveal';
      const q = getQuestion(state.currentIndex);
      if(q && state.myAnswerThisRound !== null) playTone(state.myAnswerThisRound === q.correct);
    }
    if(status==='end') state.screen='end';
  }
  render();
}
function playTone(isCorrect){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = isCorrect ? 880 : 220;
    g.gain.value = 0.15;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    o.stop(ctx.currentTime + 0.35);
  }catch(e){}
}

/* ================== منطق المضيف (Host) ================== */
function createRoom(name, customCode){
  state.role='host';
  state.playerName = name;
  state.roomCode = customCode || genCode();
  const initialPlayers = {};
  initialPlayers[state.myId] = { name, score:0, streak:0 };
  whenAuthReady(function(){
    roomRef(state.roomCode).set({ status:'lobby', currentIndex:-1, players:initialPlayers, createdAt: Date.now() });
  });
  attachRoomListener();
  saveSession();
}
function startGame(){
  const cats = (state.selectedCats && state.selectedCats.length) ? state.selectedCats : CATEGORIES;
  const diffs = (state.selectedDiffs && state.selectedDiffs.length) ? state.selectedDiffs : [1,2,3];
  const pool = QUESTIONS.map((q,i)=>i).filter(i => cats.includes(QUESTIONS[i].cat) && diffs.includes(QUESTIONS[i].diff||2));
  if(pool.length === 0){ alert('لازم تختار فئة ومستوى صعوبة فيهم أسئلة قبل ما تبدأ.'); return; }
  let count = parseInt(document.getElementById('numQInput')?.value, 10);
  if(!count || count < 1) count = state.numQuestionsChoice || 20;
  count = Math.max(1, Math.min(pool.length, count));
  let dur = parseInt(document.getElementById('durSelect')?.value, 10);
  if(!dur) dur = state.durationChoice || QUESTION_DURATION;

  if(state.adaptiveMode){
    // يبدأ من مستوى وسط بين مستويات الصعوبة المختارة، ثم يرتفع وينخفض تلقائيًا
    const sortedDiffs = [...diffs].sort((a,b)=>a-b);
    const startDiff = sortedDiffs[Math.floor((sortedDiffs.length-1)/2)];
    const firstQid = pickAdaptiveQuestion(cats, diffs, startDiff, []);
    roomRef(state.roomCode).update({
      status: state.pvpMode ? 'picking' : 'question', currentIndex:0, questionStart:Date.now(),
      duration:dur, correctIndex:null, questionIds:[firstQid], pvpMode: !!state.pvpMode,
      pvpAsker:null, pvpTarget:null, fastestId:null,
      adaptiveMode:true, adaptiveDiff:startDiff, gameCats:cats, gameDiffs:diffs, totalCount:count
    });
    return;
  }
  // اسحب عشوائيًا من مجموعة الفئات المختارة فقط
  const shuffledPool = [...pool];
  for(let i=shuffledPool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [shuffledPool[i],shuffledPool[j]]=[shuffledPool[j],shuffledPool[i]]; }
  const questionIds = shuffledPool.slice(0, count);
  roomRef(state.roomCode).update({
    status: state.pvpMode ? 'picking' : 'question', currentIndex:0, questionStart:Date.now(),
    duration:dur, correctIndex:null, questionIds, pvpMode: !!state.pvpMode, pvpAsker:null, pvpTarget:null, fastestId:null,
    adaptiveMode:false, totalCount:count
  });
}
function togglePvpMode(){ state.pvpMode = !state.pvpMode; render(); }
function toggleAdaptiveMode(){ state.adaptiveMode = !state.adaptiveMode; render(); }
/* ================== الصعوبة التكيّفية ==================
   يختار سؤالًا عشوائيًا من نفس مستوى الصعوبة المستهدف؛ إن لم يتوفر، يقرّب
   لأقرب مستوى متاح ضمن الأسئلة المتبقية غير المستخدمة بعد. */
function pickAdaptiveQuestion(cats, diffs, targetDiff, usedIds){
  const pool = QUESTIONS.map((q,i)=>i).filter(i =>
    cats.includes(QUESTIONS[i].cat) && diffs.includes(QUESTIONS[i].diff||2) && !usedIds.includes(i)
  );
  if(!pool.length) return null;
  let candidates = pool.filter(i => (QUESTIONS[i].diff||2) === targetDiff);
  if(!candidates.length){
    let bestDist = Infinity;
    pool.forEach(i => {
      const d = Math.abs((QUESTIONS[i].diff||2) - targetDiff);
      if(d < bestDist) bestDist = d;
    });
    candidates = pool.filter(i => Math.abs((QUESTIONS[i].diff||2) - targetDiff) === bestDist);
  }
  return candidates[Math.floor(Math.random()*candidates.length)];
}

/* ================== وضع اللعب الفردي (Solo) — بدون غرفة، محليًا بالكامل ================== */
function showSoloSetup(){ state.soloError=null; state.screen='solo-setup'; render(); }
function toggleSoloAdaptive(){ state.soloAdaptiveMode = !state.soloAdaptiveMode; render(); }
function startSolo(){
  const name = document.getElementById('soloNameInput').value.trim();
  if(!name){ state.soloError='لازم تكتب اسمك أولاً.'; render(); return; }
  const cats = (state.selectedCats && state.selectedCats.length) ? state.selectedCats : CATEGORIES;
  const diffs = (state.selectedDiffs && state.selectedDiffs.length) ? state.selectedDiffs : [1,2,3];
  const pool = QUESTIONS.map((q,i)=>i).filter(i => cats.includes(QUESTIONS[i].cat) && diffs.includes(QUESTIONS[i].diff||2));
  if(pool.length === 0){ state.soloError='لازم تختار فئة ومستوى صعوبة فيهم أسئلة قبل ما تبدأ.'; render(); return; }
  let count = parseInt(document.getElementById('soloNumQInput')?.value, 10);
  if(!count || count < 1) count = 10;
  count = Math.max(1, Math.min(pool.length, count));
  let dur = parseInt(document.getElementById('soloDurSelect')?.value, 10);
  if(!dur) dur = QUESTION_DURATION;

  state.playerName = name;
  state.soloError = null;
  state.soloScore = 0;
  state.soloStreak = 0;
  state.soloIndex = 0;
  state.soloTotalCount = count;
  state.soloCats = cats;
  state.soloDiffs = diffs;
  state.soloMaxStreak = 0;
  state.soloCorrectCount = 0;
  state.soloCatCorrect = {};
  state.soloEarnedBadges = [];
  state._soloConfettiDone = false;

  if(state.soloAdaptiveMode){
    const sortedDiffs = [...diffs].sort((a,b)=>a-b);
    const startDiff = sortedDiffs[Math.floor((sortedDiffs.length-1)/2)];
    state.soloAdaptiveDiff = startDiff;
    state.soloQuestionIds = [pickAdaptiveQuestion(cats, diffs, startDiff, [])];
  } else {
    const shuffledPool = [...pool];
    for(let i=shuffledPool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [shuffledPool[i],shuffledPool[j]]=[shuffledPool[j],shuffledPool[i]]; }
    state.soloQuestionIds = shuffledPool.slice(0, count);
  }
  state.duration = dur;
  state.correctIndex = null;
  state.myAnswerThisRound = null;
  state.questionStart = Date.now();
  state.screen = 'solo-question';
  render();
  startHostTimer(dur, soloRevealAnswer);
}
function getSoloQuestion(index){ return QUESTIONS[state.soloQuestionIds[index]]; }
function submitSoloAnswer(choiceIndex){
  if(state.myAnswerThisRound !== null) return;
  state.myAnswerThisRound = choiceIndex;
  if(navigator.vibrate) navigator.vibrate(40);
  cancelAnimationFrame(timerRAF);
  soloRevealAnswer();
}
function soloRevealAnswer(){
  cancelAnimationFrame(timerRAF);
  if(state.correctIndex !== null) return; // منع التنفيذ مرتين (اختيار يدوي ثم انتهاء الوقت)
  const q = getSoloQuestion(state.soloIndex);
  const correct = state.myAnswerThisRound === q.correct;
  state.correctIndex = q.correct;
  if(correct){
    const elapsed = Date.now() - state.questionStart;
    const speedFactor = Math.max(0, 1 - elapsed/state.duration);
    const base = DIFF_POINTS[q.diff] || 1000;
    state.soloStreak = (state.soloStreak||0) + 1;
    const streakBonus = state.soloStreak >= 2 ? Math.min(state.soloStreak-1, 5) * 50 : 0;
    const points = Math.round(base/2 + (base/2)*speedFactor) + streakBonus;
    state.soloScore = (state.soloScore||0) + points;
    state.soloLastPoints = points;
    state.soloCorrectCount = (state.soloCorrectCount||0) + 1;
    state.soloMaxStreak = Math.max(state.soloMaxStreak||0, state.soloStreak);
    state.soloCatCorrect = {...(state.soloCatCorrect||{})};
    state.soloCatCorrect[q.cat] = (state.soloCatCorrect[q.cat]||0) + 1;
    if(state.soloAdaptiveMode && state.soloStreak >= 2 && state.soloAdaptiveDiff < 3) state.soloAdaptiveDiff += 1;
  } else {
    state.soloStreak = 0;
    state.soloLastPoints = 0;

let nextTimeout = null;
function revealAnswer(){
  const q = getQuestion(state.currentIndex);
  const idx = state.currentIndex;
  answersRef(state.roomCode).child(idx).once('value').then(snap => {
    const answers = snap.val() || {};
    const updatedPlayers = {...state.players};
    let fastestId = null, fastestTime = Infinity;
    for(const id in answers){
      if(!updatedPlayers[id]) continue;
      const a = answers[id];
      const catCorrect = {...(updatedPlayers[id].catCorrect||{})};
      if(a.choice === q.correct){
        const elapsed = a.time - state.questionStart;
        if(elapsed < fastestTime){ fastestTime = elapsed; fastestId = id; }
        const speedFactor = Math.max(0, 1 - elapsed/state.duration);
        const base = DIFF_POINTS[q.diff] || 1000;
        const streak = (updatedPlayers[id].streak||0) + 1;
        const streakBonus = streak >= 2 ? Math.min(streak-1, 5) * 50 : 0;
        const points = Math.round(base/2 + (base/2)*speedFactor) + streakBonus;
        catCorrect[q.cat] = (catCorrect[q.cat]||0) + 1;
        updatedPlayers[id] = {
          ...updatedPlayers[id], score:(updatedPlayers[id].score||0)+points, streak,
          maxStreak: Math.max(updatedPlayers[id].maxStreak||0, streak),
          correctCount: (updatedPlayers[id].correctCount||0) + 1,
          catCorrect
        };
      } else {
        updatedPlayers[id] = {...updatedPlayers[id], streak:0};
      }
    }
    if(fastestId && updatedPlayers[fastestId]){
      updatedPlayers[fastestId] = {...updatedPlayers[fastestId], fastestCount:(updatedPlayers[fastestId].fastestCount||0)+1};
    }
    roomRef(state.roomCode).update({ status:'reveal', correctIndex:q.correct, players:updatedPlayers, fastestId: fastestId || null });
    if(state.adaptiveMode){
      const totalPlayers = Object.keys(state.players||{}).length;
      let correctCount = 0;
      for(const id in answers){ if(updatedPlayers[id] && answers[id].choice === q.correct) correctCount++; }
      const ratio = totalPlayers > 0 ? correctCount/totalPlayers : 0;
      let newDiff = state.adaptiveDiff || 2;
      if(ratio >= 0.6 && newDiff < 3) newDiff += 1;
      else if(ratio < 0.3 && newDiff > 1) newDiff -= 1;
      if(newDiff !== state.adaptiveDiff){
        state.adaptiveDiff = newDiff;
        roomRef(state.roomCode).update({ adaptiveDiff:newDiff });
      }
    }
  });
  clearTimeout(nextTimeout);
  nextTimeout = setTimeout(nextQuestion, REVEAL_DURATION);
}
function goToNextNow(){
  clearTimeout(nextTimeout);
  nextQuestion();
}
function pauseGame(){
  cancelAnimationFrame(timerRAF);
  clearTimeout(nextTimeout);
  const updates = { paused:true };
  if(state.lastStatus==='question' && state.questionStart){
    updates.pausedRemaining = Math.max(0, state.duration - (Date.now()-state.questionStart));
  }
  roomRef(state.roomCode).update(updates);
}
function resumeGame(){
  roomRef(state.roomCode).once('value').then(snap => {
    const room = snap.val();
    if(!room) return;
    const updates = { paused:false };
    if(room.status==='question'){
      updates.questionStart = Date.now();
      updates.duration = (room.pausedRemaining!=null && room.pausedRemaining>0) ? room.pausedRemaining : (room.duration||QUESTION_DURATION);
    }
    roomRef(state.roomCode).update(updates);
  });
}
function endGameNow(){
  if(!confirm('متأكد إنك تبغى تنهي اللعبة الآن؟ رح تظهر النتائج النهائية بالنقاط الحالية.')) return;
  cancelAnimationFrame(timerRAF);
  clearTimeout(nextTimeout);
  roomRef(state.roomCode).update({ status:'end', paused:false });
}
function nextQuestion(){
  const nextIndex = state.currentIndex + 1;
  if(nextIndex >= totalQuestions()){
    roomRef(state.roomCode).update({ status:'end' });
    return;
  }
  let extraUpdates = {};
  if(state.adaptiveMode){
    const cats = state.gameCats || CATEGORIES;
    const diffs = state.gameDiffs || [1,2,3];
    const usedIds = state.questionIds || [];
    const nextQid = pickAdaptiveQuestion(cats, diffs, state.adaptiveDiff || 2, usedIds);
    if(nextQid === null){
      // انتهت الأسئلة المتاحة قبل الوصول للعدد المستهدف، أنهِ اللعبة بسلام
      roomRef(state.roomCode).update({ status:'end' });
      return;
    }
    extraUpdates.questionIds = [...usedIds, nextQid];
  }
  if(state.pvpMode){
    roomRef(state.roomCode).update({ ...extraUpdates, status:'picking', currentIndex:nextIndex, pvpAsker:null, pvpTarget:null, correctIndex:null, fastestId:null });
  } else {
    roomRef(state.roomCode).update({ ...extraUpdates, status:'question', currentIndex:nextIndex, questionStart:Date.now(), duration:state.duration, correctIndex:null, fastestId:null });
  }
}
function randomPickPlayers(){
  const ids = Object.keys(state.players);
  if(ids.length < 2){ alert('لازم لاعبين اثنين على الأقل لتفعيل هذا الوضع.'); return; }
  let asker = ids[Math.floor(Math.random()*ids.length)];
  let target;
  do{ target = ids[Math.floor(Math.random()*ids.length)]; } while(target===asker);
  const askerSel = document.getElementById('askerSelect');
  const targetSel = document.getElementById('targetSelect');
  if(askerSel) askerSel.value = asker;
  if(targetSel) targetSel.value = target;
}
function confirmPickAndStart(){
  const ids = Object.keys(state.players);
  if(ids.length < 2){ alert('لازم لاعبين اثنين على الأقل لتفعيل هذا الوضع.'); return; }
  const asker = document.getElementById('askerSelect').value;
  const target = document.getElementById('targetSelect').value;
  if(!asker || !target || asker===target){ alert('اختر لاعبين مختلفين للسؤال والجواب.'); return; }
  roomRef(state.roomCode).update({ status:'question', questionStart:Date.now(), duration:state.duration, correctIndex:null, pvpAsker:asker, pvpTarget:target });
}

/* ================== منطق اللاعب (Player) ================== */
function joinRoom(name, code){
  state.role='player';
  state.playerName=name;
  state.roomCode=code.toUpperCase();
  whenAuthReady(function(){
    roomRef(state.roomCode).child('players').child(state.myId).set({ name, score:0, streak:0 })
      .then(() => { attachRoomListener(); saveSession(); })
      .catch(err => {
        state.screen='join-form';
        state.joinError = 'تعذّر الانضمام: ' + err.message + ' — تأكد إن قواعد Rules بمشروع Firebase مضبوطة كما بالتعليق أعلى الكود.';
        render();
      });
  });
}
function submitAnswer(choiceIndex){
  if(state.myAnswerThisRound !== null) return;
  if(state.pvpMode && state.pvpTarget && state.myId !== state.pvpTarget) return;
  state.myAnswerThisRound = choiceIndex;
  if(navigator.vibrate) navigator.vibrate(40);
  render();
  answersRef(state.roomCode).child(state.currentIndex).child(state.myId).set({ choice:choiceIndex, time:Date.now() });
}

function startHostTimer(duration, onDone){
  cancelAnimationFrame(timerRAF);
  const start = state.questionStart;
  const bar = () => {
    const el = document.getElementById('timerFill');
    if(el){
      const pct = Math.max(0, 1-(Date.now()-start)/duration);
      el.style.width = (pct*100)+'%';
      el.style.background = pct>0.5 ? 'linear-gradient(90deg, var(--teal), var(--yellow))' : (pct>0.2 ? '#ffb020' : '#ff4d4f');
    }
    if(Date.now()-start < duration){ timerRAF = requestAnimationFrame(bar); } else { onDone(); }
  };
  timerRAF = requestAnimationFrame(bar);
}
function startPlayerTimer(duration){
  cancelAnimationFrame(timerRAF);
  const start = state.questionStart;
  const bar = () => {
    const el = document.getElementById('timerFill');
    if(el){
      const pct = Math.max(0, 1-(Date.now()-start)/duration);

}

function spawnConfetti(){
  const layer = document.getElementById('confettiLayer');
  if(!layer) return;
  const colors = ['#ffd23f','#ff6b6b','#4ecdc4','#a78bfa','#5eead4'];
  for(let i=0;i<60;i++){
    const el = document.createElement('div');
    const size = 6 + Math.random()*6;
    el.style.position='absolute';
    el.style.left = Math.random()*100+'%';
    el.style.top = '-20px';
    el.style.width = size+'px';
    el.style.height = size*1.6+'px';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.opacity = '0.9';
    el.style.borderRadius = '2px';
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    el.style.transition = `transform ${2.5+Math.random()*1.5}s linear, top ${2.5+Math.random()*1.5}s linear, opacity 0.4s linear ${2+Math.random()}s`;
    layer.appendChild(el);
    requestAnimationFrame(() => {
      el.style.top = (100+Math.random()*10)+'%';
      el.style.transform = `rotate(${720+Math.random()*360}deg)`;
      el.style.opacity = '0';
    });
    setTimeout(() => el.remove(), 4500);
  }
}

function showHostForm(){ state.hostError=null; state.screen='host-name-form'; render(); }
function exportResults(){
  answersRef(state.roomCode).once('value').then(snap => {
    const allAnswers = snap.val() || {};
    buildAndDownloadResults(allAnswers);
  }).catch(() => buildAndDownloadResults({}));
}
function buildAndDownloadResults(allAnswers){
  const lines = [];
  lines.push('نتائج مسابقة جمان');
  lines.push('كود الغرفة: ' + (state.roomCode || '—'));
  lines.push('التاريخ: ' + new Date().toLocaleString('ar'));
  lines.push('');
  lines.push('=== الترتيب النهائي ===');
  const players = sortedPlayers();
  players.forEach(([id,p], i) => {
    lines.push((i+1) + '. ' + p.name + ' — ' + (p.score||0) + ' نقطة');
  });
  lines.push('');
  lines.push('=== الأسئلة والإجابات ===');
  const total = totalQuestions();
  for(let idx=0; idx<total; idx++){
    const q = getQuestion(idx);
    if(!q) continue;
    lines.push('');
    lines.push((idx+1) + '. [' + (q.cat||'') + ' · ' + (DIFF_LABELS[q.diff]||'متوسط') + '] ' + q.q);
    q.options.forEach((opt,i) => {
      lines.push('    ' + (i===q.correct ? '✔ ' : '- ') + opt);
    });
    const roundAnswers = allAnswers[idx] || {};
    const answerLines = Object.keys(roundAnswers).map(pid => {
      const pName = (state.players[pid] || {}).name || 'لاعب محذوف';
      const a = roundAnswers[pid];
      const choiceText = (q.options[a.choice] !== undefined) ? q.options[a.choice] : '؟';
      const correct = a.choice === q.correct ? 'صحيح ✔' : 'خطأ ✘';
      return '      • ' + pName + ': ' + choiceText + ' (' + correct + ')';
    });
    if(answerLines.length){
      lines.push('    إجابات اللاعبين:');
      lines.push(...answerLines);
    } else {
      lines.push('    (ما حد جاوب هالسؤال)');
    }
  }
  const content = '\uFEFF' + lines.join('\n');
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'نتائج-جمان-' + (state.roomCode || 'game') + '.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function handleHostClick(){
  const name = document.getElementById('hostNameInput').value.trim();
  let customCode = document.getElementById('hostCodeInput').value.trim().toUpperCase();
  if(!name){ state.hostError='لازم تكتب اسمك أولاً.'; render(); return; }
  if(customCode){
    if(customCode.length !== 4 || !/^[A-Z0-9]{4}$/.test(customCode)){
      state.hostError='كود الغرفة لازم يكون 4 أحرف/أرقام إنجليزية بالضبط.'; render(); return;
    }
    state.hostError=null;
    // تحقق إن الكود مو مستخدم حاليًا بغرفة نشطة
    roomRef(customCode).once('value').then(snap => {
      const existing = snap.val();
      if(existing && existing.status !== 'end'){
        state.hostError='هذا الكود مستخدم حاليًا بغرفة أخرى، جرب كود ثاني.';
        render();
      } else {
        createRoom(name, customCode);
      }
    }).catch(() => { createRoom(name, customCode); });
  } else {
    createRoom(name);
  }
}
function showJoinForm(){ state.joinError=null; state.screen='join-form'; render(); }
function handleJoinClick(){
  const name = document.getElementById('nameInput').value.trim();
  const code = document.getElementById('codeInput').value.trim();
  if(!name){ state.joinError='لازم تكتب اسمك أولاً.'; render(); return; }
  if(code.length !== 4){ state.joinError='كود الغرفة لازم يكون 4 أحرف بالضبط.'; render(); return; }
  state.joinError = null;
  state.screen = 'joining';
  render();
  joinRoom(name, code);
}
/* ================== استعادة الجلسة بعد التحديث/الإغلاق ================== */
function restoreSession(){
  if(!configReady) return false;
  if(!saved || !saved.roomCode || !saved.role) return false;
  // تحقق أول إن الغرفة المحفوظة لسا موجودة ومو منتهية قبل ما نرجع لها تلقائيًا
  roomRef(saved.roomCode).once('value').then(snap => {
    const room = snap.val();
    if(!room || room.status === 'end'){
      clearSession();
      render();
      return;
    }
    state.role = saved.role;
    state.roomCode = saved.roomCode;
    state.playerName = saved.playerName || '';
    attachRoomListener();
  }).catch(() => { clearSession(); render(); });
  return true;
}

// إعادة مزامنة فورية كل ما رجع التطبيق يكون ظاهر (بعد قفل الشاشة أو تبديل التطبيقات)
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && state.roomCode && db){
    roomRef(state.roomCode).once('value').then(snap => handleRoomSnapshot(snap.val()));
  }
});
window.addEventListener('online', () => {
  if(state.roomCode && db){
    roomRef(state.roomCode).once('value').then(snap => handleRoomSnapshot(snap.val()));
  }
});

if(!restoreSession()) render();
</script>
